services:
    postgres:
        image: pgvector/pgvector:0.8.6-pg18
        container_name: capstone-postgres
        environment:
            POSTGRES_DB: capstone
            POSTGRES_USER: capstone
            POSTGRES_PASSWORD: capstone
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U capstone -d capstone"]
            interval: 5s
            timeout: 5s
            retries: 10

    rustfs:
        image: rustfs/rustfs:latest
        container_name: capstone-rustfs
        environment:
            RUSTFS_ACCESS_KEY: capstone
            RUSTFS_SECRET_KEY: capstone-secret
        command: ["rustfs", "--address", "0.0.0.0:9000", "/data"]
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - rustfs-data:/data

    rustfs-init:
        image: minio/mc:latest
        depends_on:
            rustfs:
                condition: service_started
        entrypoint:
            - /bin/sh
            - -ec
            - |
                for attempt in $(seq 1 30); do
                    if mc alias set rustfs http://rustfs:9000 capstone capstone-secret \
                        && mc mb --ignore-existing rustfs/capstone-files; then
                        exit 0
                    fi
                    echo "Waiting for RustFS bucket initialization: attempt $${attempt}/30"
                    sleep 2
                done
                echo "RustFS bucket initialization failed" >&2
                exit 1
        restart: "no"

volumes:
    postgres-data:
    rustfs-data:
