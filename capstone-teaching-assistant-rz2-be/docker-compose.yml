services:
    postgres:
        image: pgvector/pgvector:0.8.6-pg18
        container_name: capstone-postgres
        environment:
            POSTGRES_DB: capstone
            POSTGRES_USER: capstone
            POSTGRES_PASSWORD: capstone
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U capstone -d capstone"]
            interval: 5s
            timeout: 5s
            retries: 10

    rustfs:
        image: rustfs/rustfs:latest
        container_name: capstone-rustfs
        environment:
            RUSTFS_ACCESS_KEY: capstone
            RUSTFS_SECRET_KEY: capstone-secret
        command: ["rustfs", "--address", "0.0.0.0:9000", "/data"]
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - rustfs-data:/data
        healthcheck:
            test:
                ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 12

    rustfs-init:
        image: minio/mc:latest
        depends_on:
            rustfs:
                condition: service_healthy
        entrypoint:
            - /bin/sh
            - -c
            - |
                mc alias set rustfs http://rustfs:9000 capstone capstone-secret
                mc mb --ignore-existing rustfs/capstone-files
        restart: "no"

volumes:
    postgres-data:
    rustfs-data:
